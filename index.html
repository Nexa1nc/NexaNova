<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexaNova</title>
    <style>
      :root {
        --bg: #f4f2ec;
        --ink: #111111;
        --muted: rgba(17, 17, 17, 0.55);
        --line: rgba(17, 17, 17, 0.12);
        --panel: rgba(255, 255, 255, 0.42);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app {
        width: min(100%, 980px);
        padding: 32px 20px 60px;
      }

      .home {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 78vh;
        gap: 18px;
      }

      .logo-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: min(100%, 620px);
      }

      .logo-img {
        width: min(100%, 500px);
        height: auto;
        display: block;
      }

      .search-box {
        position: relative;
        width: min(100%, 760px);
        border: 1px solid var(--line);
        background: transparent;
      }

      .search-box input {
        width: 100%;
        border: none;
        background: transparent;
        padding: 20px 62px 20px 20px;
        font-size: 1.05rem;
        color: var(--ink);
        outline: none;
      }

      .search-box input::placeholder {
        color: rgba(17, 17, 17, 0.38);
      }

      .search-btn {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 38px;
        height: 38px;
        border: none;
        border-radius: 999px;
        background: var(--ink);
        color: var(--bg);
        cursor: pointer;
      }

      .results {
        display: none;
      }

      .results.active {
        display: block;
      }

      .results-header {
        color: rgba(17, 17, 17, 0.6);
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 20px;
      }

      .result-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .result-item {
        display: flex;
        gap: 14px;
        padding: 16px 18px;
        background: var(--panel);
        border: 1px solid var(--line);
      }

      .favicon {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border-radius: 8px;
        overflow: hidden;
        background: rgba(17, 17, 17, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .favicon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .result-body {
        min-width: 0;
        flex: 1;
      }

      .url-line {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .url {
        font-size: 0.7rem;
        color: rgba(17, 17, 17, 0.55);
        word-break: break-all;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 0.62rem;
        background: rgba(34, 197, 94, 0.12);
        color: #166534;
        border: 1px solid rgba(34, 197, 94, 0.22);
      }

      .result-title {
        display: inline-block;
        color: var(--ink);
        text-decoration: none;
        font-size: 1.08rem;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .result-title:hover {
        text-decoration: underline;
      }

      .result-desc {
        margin: 0;
        color: rgba(17, 17, 17, 0.7);
        line-height: 1.6;
        font-size: 0.88rem;
      }

      .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }

      .page-btn {
        background: var(--ink);
        color: var(--bg);
        border: none;
        padding: 12px 18px;
        cursor: pointer;
        font-weight: 700;
      }

      .page-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .status {
        color: rgba(17, 17, 17, 0.6);
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      @media (max-width: 620px) {
        .result-item {
          flex-direction: column;
        }

        .pagination {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="home" id="homeSection">
        <div class="logo-wrap">
          <img
            class="logo-img"
            src="./logo.png"
            alt="NexaNova logo"
            onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/Nexa1nc/NexaNova/main/logo.png';"
          />
        </div>

        <form class="search-box" id="homeForm">
          <input id="homeQuery" type="text" placeholder="Inizia a digitare" autocomplete="off" />
          <button class="search-btn" type="submit" aria-label="Cerca">→</button>
        </form>
      </section>

      <section class="results" id="resultsSection">
        <div class="results-header" id="resultsHeader">Risultati</div>
        <div class="result-list" id="resultList"></div>

        <div class="pagination">
          <button class="page-btn" id="prevBtn" type="button" disabled>← Precedente</button>
          <div class="status" id="pageStatus">Pagina 1</div>
          <button class="page-btn" id="nextBtn" type="button">Successiva →</button>
        </div>
      </section>
    </div>

    <script>
      const state = {
        query: '',
        page: 1,
        results: [],
        perPage: 10
      };

      const homeForm = document.getElementById('homeForm');
      const homeQuery = document.getElementById('homeQuery');
      const resultList = document.getElementById('resultList');
      const resultsSection = document.getElementById('resultsSection');
      const pageStatus = document.getElementById('pageStatus');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function safeUrl(value) {
        try {
          const url = new URL(value);
          if (url.protocol !== 'http:' && url.protocol !== 'https:') return '#';
          return url.href;
        } catch {
          return '#';
        }
      }

      function getFaviconUrl(urlString) {
        try {
          const url = new URL(urlString);
          return `https://www.google.com/s2/favicons?sz=32&domain=${url.hostname}`;
        } catch {
          return '';
        }
      }

      function updateUrl(query) {
        const url = new URL(window.location.href);
        url.searchParams.set('q', query);
        window.history.pushState({}, '', url);
      }

      function setResultsVisible(visible) {
        resultsSection.classList.toggle('active', visible);
      }

      function renderResults() {
        const start = (state.page - 1) * state.perPage;
        const end = start + state.perPage;
        const current = state.results.slice(start, end);

        if (!current.length) {
          resultList.innerHTML = '<div class="result-item"><div class="result-body"><p class="result-desc">Nessun risultato trovato.</p></div></div>';
          pageStatus.textContent = 'Pagina 0';
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          return;
        }

        const totalPages = Math.max(1, Math.ceil(state.results.length / state.perPage));

        resultList.innerHTML = current
          .map((item) => {
            const title = item.title || 'Risultato';
            const url = safeUrl(item.url || '#');
            const description = item.description || item.snippet || item.summary || item.text || 'Nessuna descrizione disponibile.';
            const favicon = getFaviconUrl(url);
            const verified = item.verified ? '<span class="badge">Verificato</span>' : '';

            return `
              <article class="result-item">
                <div class="favicon">
                  <img src="${favicon}" alt="favicon" onerror="this.style.display='none';" />
                </div>
                <div class="result-body">
                  <div class="url-line">
                    <span class="url">${escapeHtml(new URL(url).hostname || url)}</span>
                    ${verified}
                  </div>
                  <a class="result-title" href="${url}" target="_blank" rel="noreferrer noopener">${escapeHtml(title)}</a>
                  <p class="result-desc">${escapeHtml(description)}</p>
                </div>
              </article>
            `;
          })
          .join('');

        pageStatus.textContent = `Pagina ${state.page} di ${totalPages}`;
        prevBtn.disabled = state.page <= 1;
        nextBtn.disabled = state.page >= totalPages;
      }

      async function search(query) {
        const clean = query.trim();
        if (!clean) return;

        state.query = clean;
        state.page = 1;
        updateUrl(clean);
        homeQuery.value = clean;

        try {
          const response = await fetch(`/api/search?q=${encodeURIComponent(clean)}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          state.results = Array.isArray(data.results) ? data.results : [];

          setResultsVisible(true);
          renderResults();
        } catch (error) {
          console.error('Search failed:', error);
          state.results = [];
          setResultsVisible(true);
          resultList.innerHTML = '<div class="result-item"><div class="result-body"><p class="result-desc">Errore nella ricerca. Riprova.</p></div></div>';
          pageStatus.textContent = 'Pagina 0';
          prevBtn.disabled = true;
          nextBtn.disabled = true;
        }
      }

      homeForm.addEventListener('submit', (event) => {
        event.preventDefault();
        search(homeQuery.value);
      });

      prevBtn.addEventListener('click', () => {
        if (state.page > 1) {
          state.page -= 1;
          renderResults();
        }
      });

      nextBtn.addEventListener('click', () => {
        const totalPages = Math.ceil(state.results.length / state.perPage) || 1;
        if (state.page < totalPages) {
          state.page += 1;
          renderResults();
        }
      });

      window.addEventListener('load', () => {
        const params = new URLSearchParams(window.location.search);
        const q = params.get('q');
        if (q) {
          homeQuery.value = q;
          search(q);
        }
      });
    </script>
  </body>
</html>
