<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaNova Search</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0e15;
      color: #e2e8f0;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      overflow-x: hidden;
      position: relative;
    }
    canvas#space-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      width: 100%;
      margin-top: 4rem;
    }
    .brand {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .brand h1 {
      font-size: 3rem;
      letter-spacing: -1px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
    }
    .brand p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 0.5rem;
    }
    .search-box {
      display: flex;
      gap: 10px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      padding: 12px 16px;
    }
    .search-box button {
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-family: 'Space Mono', monospace;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .search-box button:hover {
      background: #4f46e5;
      transform: translateY(-1px);
    }
    .results-list {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .result-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1.25rem;
      border-radius: 10px;
      transition: border-color 0.2s ease;
    }
    .result-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }
    .result-card a {
      color: #818cf8;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 0.4rem;
    }
    .result-card a:hover {
      text-decoration: underline;
    }
    .result-url {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 0.5rem;
      word-break: break-all;
    }
    .result-snippet {
      font-size: 0.875rem;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .status-msg {
      text-align: center;
      color: #94a3b8;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <canvas id="space-canvas"></canvas>

  <div class="container">
    <div class="brand">
      <h1>NexaNova</h1>
      <p>Autonomous Search Engine</p>
    </div>

    <div class="search-box">
      <input type="text" id="queryInput" placeholder="Cerca nel web libero..." onkeydown="if(event.key==='Enter') executeSearch()">
      <button onclick="executeSearch()">CERCA</button>
    </div>

    <div id="status" class="status-msg"></div>
    <div id="results" class="results-list"></div>
  </div>

  <script>
    // Canvas Interattivo Sfondo
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < 80; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 1.5,
          speed: Math.random() * 0.5 + 0.1
        });
      }
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
        star.y += star.speed;
        if (star.y > canvas.height) star.y = 0;
      });
      requestAnimationFrame(animateStars);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animateStars();

    // Logica di Ricerca
    async function executeSearch() {
      const query = document.getElementById('queryInput').value.trim();
      const statusDiv = document.getElementById('status');
      const resultsDiv = document.getElementById('results');

      if (!query) return;

      statusDiv.innerText = 'Ricerca nel database in corso...';
      resultsDiv.innerHTML = '';

      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (!data.results || data.results.length === 0) {
          statusDiv.innerText = 'Nessun risultato trovato per questa query.';
          return;
        }

        statusDiv.innerText = `Trovati ${data.results.length} risultati:`;
        
        data.results.forEach(item => {
          const card = document.createElement('div');
          card.className = 'result-card';
          card.innerHTML = `
            <a href="${item.url}" target="_blank" rel="noopener">${item.title}</a>
            <div class="result-url">${item.url}</div>
            <div class="result-snippet">${item.snippet || 'Nessuna descrizione disponibile.'}</div>
          `;
          resultsDiv.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        statusDiv.innerText = 'Errore di connessione con il motore di ricerca.';
      }
    }
  </script>
</body>
</html>
