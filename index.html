<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaNova Search</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      margin-top: 5vh;
      text-align: center;
      transition: all 0.3s ease;
    }

    h1.brand {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
      letter-spacing: -1px;
    }

    .search-container {
      width: 100%;
      max-width: 650px;
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .search-input {
      flex: 1;
      padding: 0.85rem 1.25rem;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-button {
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      background-color: var(--accent);
      color: #000;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .search-button:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    .status-msg {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .results-container {
      width: 100%;
      max-width: 750px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .result-card {
      background-color: var(--card-bg);
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      transition: transform 0.2s ease;
    }

    .result-card:hover {
      transform: translateY(-2px);
    }

    .result-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .result-title a {
      color: var(--accent);
      text-decoration: none;
    }

    .result-title a:hover {
      text-decoration: underline;
    }

    .result-url {
      font-size: 0.85rem;
      color: #10b981;
      margin-bottom: 0.5rem;
      word-break: break-all;
    }

    .result-snippet {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 2rem;
    }

    .page-btn {
      padding: 0.5rem 1rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 8px;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: var(--accent);
      color: #000;
      font-weight: bold;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: var(--accent);
      animation: spin 1s linear infinite;
      margin: 2rem auto;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <h1 class="brand">NexaNova</h1>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Cerca sul Web..." onkeydown="if(event.key==='Enter') search();">
    <button class="search-button" onclick="search()">Cerca</button>
  </div>

  <div id="spinner" class="spinner"></div>
  <div id="statusMsg" class="status-msg"></div>
  <div id="resultsContainer" class="results-container"></div>
  <div id="pagination" class="pagination"></div>

  <script>
    // ⚠️ SOSTITUISCI CON L'URL DEL TUO PROXY SU RENDER!
    const PROXY_URL = 'https://nexanova-proxy.onrender.com';

    let allResults = [];
    let currentPage = 1;
    const resultsPerPage = 5;

    async function search() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const spinner = document.getElementById('spinner');
      const statusMsg = document.getElementById('statusMsg');
      const container = document.getElementById('resultsContainer');
      const pagination = document.getElementById('pagination');

      // Reset interfaccia
      container.innerHTML = '';
      pagination.innerHTML = '';
      spinner.style.display = 'block';
      statusMsg.innerText = 'Ricerca in corso tramite NexaNova Proxy Server...\n(Se il server era in pausa, potrebbe impiegare 15-20 secondi per il primo avvio)';

      try {
        const response = await fetch(PROXY_URL + encodeURIComponent(query));
        const data = await response.json();

        spinner.style.display = 'none';

        if (data.results && data.results.length > 0) {
          allResults = data.results;
          currentPage = 1;
          statusMsg.innerText = `Trovati ${allResults.length} risultati per "${query}"`;
          renderResults();
        } else {
          statusMsg.innerText = `Nessun risultato trovato per "${query}".`;
        }
      } catch (error) {
        console.error('Errore durante la ricerca:', error);
        spinner.style.display = 'none';
        statusMsg.innerText = 'Errore durante la connessione al server Proxy. Assicurati che l\'URL su Render sia corretto.';
      }
    }

    function renderResults() {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      const startIndex = (currentPage - 1) * resultsPerPage;
      const endIndex = startIndex + resultsPerPage;
      const pageResults = allResults.slice(startIndex, endIndex);

      pageResults.forEach(item => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <div class="result-title"><a href="${item.url}" target="_blank" rel="noopener">${item.title}</a></div>
          <div class="result-url">${item.url}</div>
          <div class="result-snippet">${item.description}</div>
        `;
        container.appendChild(card);
      });

      renderPagination();
    }

    function renderPagination() {
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';

      const totalPages = Math.ceil(allResults.length / resultsPerPage);
      if (totalPages <= 1) return;

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        btn.innerText = i;
        btn.onclick = () => {
          currentPage = i;
          renderResults();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        pagination.appendChild(btn);
      }
    }
  </script>
</body>
</html>
