<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaNova — Motore di Ricerca Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #090d16;
      --card-bg: #111827;
      --card-border: #1f293d;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .search-box {
      display: flex;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 8px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 12px 16px;
      font-size: 1.05rem;
      color: var(--text-main);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-btn {
      background: var(--accent);
      color: #000;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .status-bar {
      margin-top: 20px;
      margin-bottom: 25px;
      font-size: 0.88rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 24px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--card-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.15s, border-color 0.15s;
    }

    .result-card:hover {
      border-color: #374151;
      transform: translateY(-1px);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .result-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      line-height: 1.3;
    }

    .result-title:hover {
      text-decoration: underline;
    }

    .result-url {
      font-size: 0.82rem;
      color: var(--success);
      margin-bottom: 10px;
      word-break: break-all;
    }

    .result-snippet {
      font-size: 0.93rem;
      color: #d1d5db;
      line-height: 1.5;
    }

    .provider-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 500;
      background: #1e293b;
      color: var(--accent);
      border: 1px solid var(--card-border);
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 12px;
    }

    footer {
      margin-top: auto;
      padding-top: 40px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">NexaNova</div>
      <div class="subtitle">Motore di Ricerca Web Veloce & Senza Limiti</div>
    </header>

    <form class="search-box" id="search-form">
      <input 
        type="text" 
        id="search-input" 
        class="search-input" 
        placeholder="Cerca su internet o digita un URL..." 
        autocomplete="off"
        required 
      />
      <button type="submit" class="search-btn">Cerca</button>
    </form>

    <div class="status-bar">
      <div class="spinner" id="spinner"></div>
      <span id="status-text"></span>
    </div>

    <main class="results-list" id="results"></main>
  </div>

  <footer>
    NexaNova Search — Powered by Hybrid Multi-Engine Fallback
  </footer>

  <script src="script.js"></script>
</body>
</html>
