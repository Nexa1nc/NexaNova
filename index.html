<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaNova Search</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -1px;
        }

        .search-container {
            width: 100%;
            max-width: 650px;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            font-size: 1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0369a1;
        }

        .status-bar {
            font-size: 0.88rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            min-height: 20px;
        }

        .results {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .result-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px;
        }

        .result-card a {
            font-size: 1.15rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .result-card a:hover {
            text-decoration: underline;
        }

        .result-card .url {
            font-size: 0.85rem;
            color: #10b981;
            margin: 4px 0 8px 0;
            word-break: break-all;
        }

        .result-card p {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.4;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            background: #334155;
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">NexaNova</div>
    </div>

    <div class="search-container">
        <form class="search-box" id="search-form">
            <input type="text" id="search-input" placeholder="Cerca su NexaNova..." required>
            <button type="submit">Cerca</button>
        </form>
    </div>

    <div class="status-bar" id="status-text"></div>

    <div class="results" id="results"></div>

    <script src="script.js"></script>
</body>
</html>
