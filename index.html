<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexaNova</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Space Mono', monospace; box-sizing: border-box; }
    html, body { width: 100vw; margin: 0; padding: 0; overflow-x: hidden; }
    body { background-color: #f4f2ec; color: #111111; min-height: 100vh; overflow-y: hidden; }
    body.results-active { overflow-y: auto; }
    #touch-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    header { position: fixed; top: 0; left: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 32px 40px; z-index: 50; transition: all 0.4s ease; }
    body.results-active header { padding: 20px 40px; background: rgba(244, 242, 236, 0.9); backdrop-filter: blur(10px); }
    .brand { display: flex; align-items: center; cursor: pointer; }
    .brand-dot { width: 10px; height: 10px; background: #111111; flex-shrink: 0; }
    .clock { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; color: #111111; margin-left: auto; }
    
    .home-section { position: relative; z-index: 10; width: 100%; max-width: 620px; padding: 0 32px; display: flex; flex-direction: column; align-items: center; margin: 0 auto; min-height: 100vh; justify-content: center; margin-top: -150px; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    body.results-active .home-section { opacity: 0; transform: translateY(-50px) scale(0.95); pointer-events: none; position: absolute; }
    .logo-img { width: 500px; height: 250px; object-fit: contain; margin-bottom: 10px; transform: scale(1.35); }

    .search-frame { position: relative; width: 100%; }
    .corner { position: absolute; width: 14px; height: 14px; border-color: rgba(17,17,17,0.22); border-style: solid; transition: border-color 0.25s ease, transform 0.25s ease; pointer-events: none; }
    .corner.tl { top: 0; left: 0; border-width: 1.5px 0 0 1.5px; }
    .corner.tr { top: 0; right: 0; border-width: 1.5px 1.5px 0 0; }
    .corner.bl { bottom: 0; left: 0; border-width: 0 0 1.5px 1.5px; }
    .corner.br { bottom: 0; right: 0; border-width: 0 1.5px 1.5px 0; }
    .search-frame:focus-within .corner { border-color: #111111; transform: scale(1.15); }
    .search-frame input { width: 100%; background: transparent; border: none; outline: none; padding: 22px 56px 22px 24px; font-size: 1.05rem; color: #111111; }
    .search-frame input::placeholder { color: rgba(17,17,17,0.35); }
    .search-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border: none; border-radius: 50%; background: #111111; color: #f4f2ec; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s ease; }
    .search-btn:hover { transform: translateY(-50%) scale(1.08); background: #333333; }
    .hint { margin-top: 28px; font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(17,17,17,0.38); }

    .results-top-bar { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); width: 460px; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
    body.results-active .results-top-bar { opacity: 1; pointer-events: auto; }
    .results-top-bar .search-frame input { padding: 16px 48px 16px 20px; font-size: 0.9rem; }
    .results-top-bar .corner { width: 11px; height: 11px; }
    .results-top-bar .search-btn { width: 32px; height: 32px; right: 10px; }

    .results-container { position: relative; z-index: 10; width: 100%; max-width: 780px; margin: 0 auto; padding: 120px 40px 100px; opacity: 0; transform: translateY(40px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); display: none; }
    body.results-active .results-container { display: block; opacity: 1; transform: translateY(0); }
    .results-label { margin-bottom: 36px; font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(17,17,17,0.34); border-bottom: 1px solid rgba(17,17,17,0.08); padding-bottom: 14px; }
    .result-item { margin-bottom: 28px; position: relative; padding: 20px; background: rgba(255,255,255,0.4); border-radius: 4px; transition: transform 0.2s ease; }
    .result-item:hover { transform: translateX(8px); }
    
    .url-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .res-url { font-size: 0.7rem; color: rgba(17,17,17,0.5); word-break: break-all; }
    .verified-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.65rem; color: #16a34a; font-weight: 700; background: rgba(22, 163, 74, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(22, 163, 74, 0.2); }

    .res-title { font-size: 1.15rem; font-weight: 700; color: #111111; text-decoration: none; margin-bottom: 8px; display: inline-block; }
    .res-title:hover { text-decoration: underline; }
    .res-desc { font-size: 0.85rem; line-height: 1.6; color: rgba(17,17,17,0.6); }

    .pagination-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(17,17,17,0.15); }
    .page-btn { background: #111111; color: #f4f2ec; border: none; padding: 12px 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; transition: opacity 0.2s; }
    .page-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .page-btn:not(:disabled):hover { background: #333333; }
    .page-indicator { font-size: 0.8rem; font-weight: 700; color: #111111; }

    footer { position: fixed; bottom: 24px; width: 100%; text-align: center; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(17,17,17,0.4); z-index: 5; }
    body.results-active footer { position: relative; bottom: 0; padding: 40px 0; }
  </style>
</head>
<body>

  <canvas id="touch-canvas"></canvas>

  <header>
    <div class="brand" onclick="goHome()">
      <div class="brand-dot"></div>
    </div>
    <div class="clock" id="clock">00:00:00</div>
  </header>

  <div class="results-top-bar">
    <form class="search-frame" onsubmit="return handleSearch(event, 'top')">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <input type="text" id="topQuery" placeholder="Cerca ancora..." autocomplete="off" />
      <button type="submit" class="search-btn" aria-label="Cerca">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </form>
  </div>

  <main class="home-section" id="homeSection">
    <img src="logo.png" alt="NexaNova logo" class="logo-img" />
    <form class="search-frame" onsubmit="return handleSearch(event, 'home')">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <input type="text" id="homeQuery" placeholder="Inizia a digitare" autocomplete="off" />
      <button type="submit" class="search-btn" aria-label="Cerca">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </form>
    <p class="hint">Premi invio per cercare</p>
  </main>

  <div class="results-container" id="resultsSection">
    <div id="resultsList"></div>

    <div class="pagination-bar">
      <button id="prevBtn" class="page-btn" onclick="changePage(-1)" disabled>← Precedente</button>
      <span id="pageIndicator" class="page-indicator">Pagina 1</span>
      <button id="nextBtn" class="page-btn" onclick="changePage(1)">Successiva →</button>
    </div>
  </div>

  <footer>Created By Mattia Ristori</footer>

  <script>
    let currentPage = 1;
    let currentQuery = "";
    let cachedResults = [];
    const PAGE_SIZE = 10;

    function handleSearch(e, type) {
      e.preventDefault();
      const query = type === 'home' ? document.getElementById('homeQuery').value : document.getElementById('topQuery').value;
      if (query.trim() === '') return false;

      currentQuery = query;
      currentPage = 1;
      document.getElementById('homeQuery').value = query;
      document.getElementById('topQuery').value = query;
      showResults(query);
      return false;
    }

    function changePage(direction) {
      currentPage += direction;
      if (currentPage < 1) currentPage = 1;
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function showResults(query) {
      const list = document.getElementById('resultsList');
      list.innerHTML = `<p class="results-label">Ricerca in corso su NexaNova...</p>`;
      document.body.classList.add('results-active');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      const startTime = performance.now();
      let resultsFound = [];

      // --- OPZIONE 1: Marginalia Web Search API (Restituisce decine di risultati reali da tutto il web) ---
      try {
        const margUrl = `https://api.marginalia.nu/v1/search/${encodeURIComponent(query)}?public=true`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);

        const res = await fetch(margUrl, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (data.results && data.results.length > 0) {
            resultsFound = data.results.map(r => ({
              url: r.url,
              title: r.title || r.url,
              description: r.description || "Risultato web indicizzato da Marginalia Engine."
            }));
          }
        }
      } catch (err) {
        console.warn("Opzione 1 (Marginalia) in fallback...");
      }

      // --- OPZIONE 2: Wikipedia Search API (Richiede fino a 50 risultati in italiano) ---
      try {
        const wikiUrl = `https://it.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=50&format=json&origin=*`;
        const wikiRes = await fetch(wikiUrl);
        if (wikiRes.ok) {
          const wikiData = await wikiRes.json();
          if (wikiData.query && wikiData.query.search.length > 0) {
            const wikiResults = wikiData.query.search.map(item => ({
              url: `https://it.wikipedia.org/wiki/${encodeURIComponent(item.title)}`,
              title: item.title,
              description: item.snippet.replace(/<[^>]+>/g, '') + '...'
            }));
            // Uniamo i risultati così abbiamo sia il web che l'enciclopedia
            resultsFound = [...resultsFound, ...wikiResults];
          }
        }
      } catch (err) {
        console.warn("Opzione 2 (Wikipedia) in fallback...");
      }

      // --- OPZIONE 3: DuckDuckGo Instant Answer API (Per definizioni rapide) ---
      try {
        const ddgApiUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_redirect=1&no_html=1`;
        const ddgRes = await fetch(ddgApiUrl);
        if (ddgRes.ok) {
          const ddgData = await ddgRes.json();
          if (ddgData.AbstractText && ddgData.AbstractURL) {
            resultsFound.unshift({
              url: ddgData.AbstractURL,
              title: ddgData.Heading || query,
              description: ddgData.AbstractText
            });
          }
          if (ddgData.RelatedTopics && ddgData.RelatedTopics.length > 0) {
            ddgData.RelatedTopics.forEach(topic => {
              if (topic.FirstURL && topic.Text) {
                resultsFound.push({
                  url: topic.FirstURL,
                  title: topic.Text.split(' - ')[0] || "Risultato correlato",
                  description: topic.Text
                });
              }
            });
          }
        }
      } catch (err) {
        console.warn("Opzione 3 (DuckDuckGo API) in fallback...");
      }

      const elapsedTime = ((performance.now() - startTime) / 1000).toFixed(2);
      
      // Rimuove eventuali duplicati per URL
      const uniqueResults = [];
      const seenUrls = new Set();
      for (const item of resultsFound) {
        if (!seenUrls.has(item.url)) {
          seenUrls.add(item.url);
          uniqueResults.push(item);
        }
      }

      cachedResults = uniqueResults;

      if (cachedResults.length > 0) {
        renderCurrentPage(elapsedTime);
      } else {
        list.innerHTML = `<p class="results-label">Nessun risultato trovato per "${query}" (${elapsedTime}s). Prova con altre parole.</p>`;
        document.getElementById('prevBtn').disabled = true;
        document.getElementById('nextBtn').disabled = true;
      }
    }

    function renderCurrentPage(elapsedTime = null) {
      const list = document.getElementById('resultsList');
      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const endIndex = startIndex + PAGE_SIZE;
      const pageItems = cachedResults.slice(startIndex, endIndex);
      const totalPages = Math.ceil(cachedResults.length / PAGE_SIZE);

      const timeText = elapsedTime ? ` in ${elapsedTime}s` : '';
      list.innerHTML = `<p class="results-label">Pagina ${currentPage} di ${totalPages} - ${cachedResults.length} Risultati per: ${currentQuery}${timeText}</p>`;

      pageItems.forEach(point => {
        const url = point.url || "#";
        const title = point.title || url;
        let desc = point.description || "Nessuna descrizione disponibile.";

        list.innerHTML += `
          <div class="result-item">
            <div class="url-row">
              <span class="verified-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                NexaNova Verified
              </span>
              <span class="res-url">${url}</span>
            </div>
            <a href="${url}" target="_blank" rel="noopener noreferrer" class="res-title">${title}</a>
            <p class="res-desc">${desc}</p>
          </div>
        `;
      });

      document.getElementById('pageIndicator').textContent = `Pagina ${currentPage} / ${totalPages}`;
      document.getElementById('prevBtn').disabled = (currentPage === 1);
      document.getElementById('nextBtn').disabled = (currentPage >= totalPages);
    }

    function goHome() {
      document.body.classList.remove('results-active');
      document.getElementById('homeQuery').value = '';
      document.getElementById('topQuery').value = '';
    }

    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('it-IT');
    }
    setInterval(updateClock, 1000);
    updateClock();

    const canvas = document.getElementById('touch-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, dots = [];
    const mouse = { x: -1000, y: -1000 };

    function initCanvas() {
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = width; canvas.height = height;
      dots = [];
      for (let i = 0; i < 160; i++) {
        dots.push({ x: Math.random() * width, y: Math.random() * height, ox: 0, oy: 0, base: 0.05 + Math.random() * 0.05, size: 1 + Math.random() * 0.8 });
      }
    }
    window.addEventListener('resize', initCanvas);
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

    function animate() {
      ctx.clearRect(0, 0, width, height);
      dots.forEach(d => {
        const dx = mouse.x - d.x, dy = mouse.y - d.y, dist = Math.sqrt(dx * dx + dy * dy);
        let pullX = 0, pullY = 0, alpha = d.base, size = d.size;
        if (dist < 130) {
          const force = (1 - dist / 130), angle = Math.atan2(dy, dx);
          pullX = -Math.cos(angle) * force * 20; pullY = -Math.sin(angle) * force * 20;
          alpha = d.base + force * 0.6; size = d.size + force * 1.5;
        }
        d.ox += (pullX - d.ox) * 0.1; d.oy += (pullY - d.oy) * 0.1;
        ctx.beginPath(); ctx.arc(d.x + d.ox, d.y + d.oy, size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(17,17,17,${alpha})`; ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    initCanvas(); animate();
  </script>
</body>
</html>
