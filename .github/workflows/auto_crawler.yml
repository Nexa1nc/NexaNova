name: Auto Crawler NexaNova

on:
  schedule:
    - cron: '0 */6 * * *' # Gira automaticamente ogni 6 ore
  workflow_dispatch: # Permette l'avvio manuale dal pannello GitHub

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Configura Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installa le dipendenze
        run: npm install

      - name: Esegui il Crawler
        env:
          TURSO_URL_1: ${{ secrets.TURSO_URL_1 }}
          TURSO_TOKEN_1: ${{ secrets.TURSO_TOKEN_1 }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: npm run crawl
