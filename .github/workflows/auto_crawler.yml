name: Auto Crawler NexaNova

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # <--- Portato a 20 per risolvere l'errore su Node.js

      - name: Installa dipendenze
        run: npm install

      - name: Esegui Crawler
        env:
          TURSO_URL_1: ${{ secrets.TURSO_URL_1 }}
          TURSO_TOKEN_1: ${{ secrets.TURSO_TOKEN_1 }}
        run: node crawler.js
