name: Auto Crawler NexaNova

on:
  schedule:
    # Fa girare il crawler ogni ora in automatico
    - cron: '0 * * * *'
  workflow_dispatch: # Permette l'avvio manuale dalla scheda Actions

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Installa dipendenze
        run: npm install

      - name: Esegui Crawler
        env:
          TURSO_URL_1: ${{ secrets.TURSO_URL_1 }}
          TURSO_TOKEN_1: ${{ secrets.TURSO_TOKEN_1 }}
        run: node crawler.js
