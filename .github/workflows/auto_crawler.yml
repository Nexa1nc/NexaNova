name: Crawler Automatico Web

on:
  schedule:
    # Esegue lo script ogni notte alle 02:00
    - cron: '0 2 * * *'
  # Ti permette anche di avviarlo manualmente quando vuoi
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice del progetto
        uses: actions/checkout@v3

      - name: Installa Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa le librerie necessarie
        run: |
          pip install requests qdrant-client sentence-transformers

      - name: Esegui lo script del Crawler
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python crawler.py
